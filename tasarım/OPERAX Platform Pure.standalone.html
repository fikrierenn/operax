  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

F, U+FFFD;\n}\n\n\n:root {\n  /* Brand */\n  --brand-500: hsl(243 75% 59%);\n  --brand-600: hsl(243 75% 52%);\n  --brand-400: hsl(243 75% 68%);\n  --brand-300: hsl(243 75% 78%);\n  --brand-tint-15: hsl(243 75% 59% / 0.15);\n  --brand-tint-08: hsl(243 75% 59% / 0.08);\n  --brand-glow: hsl(243 75% 59% / 0.22);\n  --brand-grad: linear-gradient(135deg, hsl(243 75% 59%), hsl(263 70% 55%));\n  --brand-grad-soft: linear-gradient(135deg, hsl(243 75% 59% / 0.10), hsl(263 70% 55% / 0.10));\n\n  /* Sidebar (dark) */\n  --side-bg: hsl(222 47% 11%);\n  --side-bg-2: hsl(222 47% 14%);\n  --side-border: hsl(222 47% 18%);\n  --side-text: hsl(215 20% 65%);\n  --side-text-strong: hsl(213 31% 91%);\n  --side-text-dim: hsl(215 16% 47%);\n\n  /* Content (light) */\n  --bg: hsl(220 14% 97%);\n  --bg-2: hsl(220 14% 94%);\n  --surface: #ffffff;\n  --surface-2: hsl(220 14% 99%);\n  --border: hsl(220 13% 91%);\n  --border-strong: hsl(220 13% 84%);\n  --text: hsl(222 47% 11%);\n  --text-2: hsl(215 16% 35%);\n  --text-3: hsl(215 16% 47%);\n  --text-4: hsl(215 16% 65%);\n  --text-mute: hsl(215 16% 75%);\n\n  /* Semantic */\n  --success: hsl(160 84% 39%);\n  --success-bg: hsl(152 81% 96%);\n  --success-text: hsl(160 84% 22%);\n  --success-border: hsl(160 60% 80%);\n\n  --warn: hsl(38 92% 50%);\n  --warn-bg: hsl(48 96% 96%);\n  --warn-text: hsl(28 80% 32%);\n  --warn-border: hsl(38 92% 80%);\n\n  --danger: hsl(0 84% 60%);\n  --danger-bg: hsl(0 86% 97%);\n  --danger-text: hsl(0 70% 38%);\n  --danger-border: hsl(0 84% 85%);\n\n  --info-bg: hsl(214 95% 96%);\n  --info-text: hsl(217 80% 38%);\n  --info-border: hsl(214 90% 86%);\n\n  --neutral-bg: hsl(220 14% 96%);\n  --neutral-text: hsl(215 16% 35%);\n  --neutral-border: hsl(220 13% 88%);\n\n  /* Type */\n  --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;\n\n  /* Shadows */\n  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);\n  --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 12px rgba(15, 23, 42, 0.04);\n  --shadow-md: 0 4px 6px rgba(15, 23, 42, 0.04), 0 12px 24px rgba(15, 23, 42, 0.06);\n  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.10), 0 4px 8px rgba(15, 23, 42, 0.04);\n  --shadow-brand: 0 8px 24px hsl(243 75% 59% / 0.28), 0 2px 6px hsl(243 75% 59% / 0.18);\n  --shadow-success: 0 8px 24px hsl(160 84% 39% / 0.25);\n  --shadow-danger: 0 8px 24px hsl(0 84% 60% / 0.25);\n}\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; height: 100%; }\nbody {\n  font-family: var(--font-sans);\n  color: var(--text);\n  background: var(--bg);\n  font-size: 13px;\n  line-height: 1.5;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  font-feature-settings: 'ss01', 'cv11';\n}\n\n.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }\n.tabnum { font-variant-numeric: tabular-nums; }\n\n/* ---------- App shell ---------- */\n.app {\n  display: grid;\n  grid-template-columns: 248px 1fr;\n  min-height: 100vh;\n  background: var(--bg);\n}\n\n/* ---------- Sidebar ---------- */\n.side {\n  background: var(--side-bg);\n  border-right: 1px solid var(--side-border);\n  color: var(--side-text);\n  display: flex;\n  flex-direction: column;\n  position: sticky;\n  top: 0;\n  height: 100vh;\n  overflow: hidden;\n}\n.side-brand {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 18px 18px 16px;\n  border-bottom: 1px solid var(--side-border);\n}\n.side-brand-mark {\n  width: 30px;\n  height: 30px;\n  border-radius: 8px;\n  background: var(--brand-grad);\n  display: grid;\n  place-items: center;\n  color: #fff;\n  font-weight: 800;\n  font-size: 14px;\n  box-shadow: 0 4px 12px hsl(243 75% 59% / 0.4), inset 0 1px 0 rgba(255,255,255,0.2);\n  letter-spacing: -0.04em;\n}\n.side-brand-name {\n  font-size: 14px;\n  font-weight: 800;\n  color: var(--side-text-strong);\n  letter-spacing: -0.01em;\n}\n.side-brand-sub {\n  font-size: 9.5px;\n  font-weight: 600;\n  color: var(--side-text-dim);\n  text-transform: uppercase;\n  letter-spacing: 0.08em;\n  margin-top: 1px;\n}\n.side-company {\n  margin: 10px 12px;\n  padding: 8px 10px;\n  border: 1px solid var(--side-border);\n  border-radius: 8px;\n  background: var(--side-bg-2);\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  cursor: pointer;\n  transition: background .15s;\n}\n.side-company:hover { background: hsl(222 47% 17%); }\n.side-company-logo {\n  width: 22px; height: 22px; border-radius: 5px;\n  background: linear-gradient(135deg, hsl(38 92% 50%), hsl(28 92% 50%));\n  display: grid; place-items: center;\n  color: #fff; font-weight: 800; font-size: 10px;\n}\n.side-company-name { font-size: 12px; font-weight: 600; color: var(--side-text-strong); }\n.side-company-sub { font-size: 10px; color: var(--side-text-dim); }\n.side-company-chevron { margin-left: auto; color: var(--side-text-dim); }\n\n.side-nav {\n  flex: 1;\n  overflow-y: auto;\n  padding: 6px 8px 12px;\n}\n.side-nav::-webkit-scrollbar { width: 6px; }\n.side-nav::-webkit-scrollbar-thumb { background: var(--side-border); border-radius: 3px; }\n\n.side-group-label {\n  font-size: 9.5px;\n  font-weight: 700;\n  color: var(--side-text-dim);\n  text-transform: uppercase;\n  letter-spacing: 0.1em;\n  padding: 14px 12px 6px;\n}\n.side-item {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 7px 12px 7px 13px;\n  margin: 1px 0;\n  border-radius: 7px;\n  font-size: 12.5px;\n  font-weight: 500;\n  color: var(--side-text);\n  cursor: pointer;\n  position: relative;\n  transition: background .14s, color .14s;\n  user-select: none;\n}\n.side-item:hover {\n  background: hsl(222 47% 15%);\n  color: var(--side-text-strong);\n}\n.side-item.active {\n  background: var(--brand-tint-15);\n  color: #fff;\n  font-weight: 600;\n}\n.side-item.active::before {\n  content: '';\n  position: absolute;\n  left: -8px;\n  top: 6px; bottom: 6px;\n  width: 3px;\n  border-radius: 0 3px 3px 0;\n  background: var(--brand-400);\n  box-shadow: 0 0 12px hsl(243 75% 59% / 0.6);\n}\n.side-item-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.9; }\n.side-item.active .side-item-icon { opacity: 1; color: var(--brand-300); }\n.side-item-badge {\n  margin-left: auto;\n  font-family: var(--font-mono);\n  font-size: 10px;\n  font-weight: 600;\n  padding: 1px 6px;\n  border-radius: 999px;\n  background: hsl(222 47% 20%);\n  color: var(--side-text-strong);\n}\n.side-item.active .side-item-badge {\n  background: hsl(243 75% 59% / 0.3);\n  color: #fff;\n}\n\n.side-foot {\n  border-top: 1px solid var(--side-border);\n  padding: 10px 12px;\n  display: flex;\n  align-items: center;\n  gap: 9px;\n}\n.side-foot-avatar {\n  width: 30px; height: 30px; border-radius: 8px;\n  background: linear-gradient(135deg, hsl(195 80% 50%), hsl(243 75% 59%));\n  display: grid; place-items: center;\n  color: #fff; font-weight: 700; font-size: 11px;\n}\n.side-foot-name { font-size: 12px; font-weight: 600; color: var(--side-text-strong); }\n.side-foot-role { font-size: 10px; color: var(--side-text-dim); }\n.side-foot-action { margin-left: auto; color: var(--side-text-dim); cursor: pointer; padding: 4px; border-radius: 5px; }\n.side-foot-action:hover { background: hsl(222 47% 17%); color: var(--side-text-strong); }\n\n/* ---------- Top bar ---------- */\n.main { display: flex; flex-direction: column; min-width: 0; }\n.topbar {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  padding: 10px 22px;\n  background: var(--surface);\n  border-bottom: 1px solid var(--border);\n  position: sticky;\n  top: 0;\n  z-index: 30;\n  backdrop-filter: blur(8px);\n}\n.topbar-search {\n  flex: 1;\n  max-width: 460px;\n  position: relative;\n}\n.topbar-search input {\n  width: 100%;\n  height: 34px;\n  border: 1px solid var(--border);\n  background: var(--bg);\n  border-radius: 8px;\n  padding: 0 36px 0 34px;\n  font-family: var(--font-sans);\n  font-size: 12.5px;\n  color: var(--text);\n  outline: none; ppercase; letter-spacing: 0.08em; color: var(--text-4); padding: 10px 10px 4px; }\n.cmdk-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }\n.cmdk-item:hover, .cmdk-item.active { background: var(--bg); }\n.cmdk-item-icon { color: var(--text-3); }\n.cmdk-item-label { flex: 1; }\n.cmdk-item-kbd { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); }\n\n/* ---------- Misc helpers ---------- */\n.scroll-x { overflow-x: auto; }\n.no-wrap { white-space: nowrap; }\n.elevated { box-shadow: var(--shadow-md); }\n<\u002Fstyle>\n  <link rel=\"icon\" href=\"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236366f1'/%3E%3Ctext x='16' y='21' font-family='system-ui' font-size='14' font-weight='800' text-anchor='middle' fill='white'%3EOX%3C/text%3E%3C/svg%3E\">\n\n  \n<\u002Fhead>\n<body>\n  <div id=\"app-root\"><\u002Fdiv>\n  <div id=\"cmdk-root\"><\u002Fdiv>\n  <div id=\"tweaks-root\"><\u002Fdiv>\n\n  <script src=\"ca0d4780-2ab8-47bc-825c-1bbee5fd7523\"><\u002Fscript>\n  <script src=\"32a70144-9457-4227-af32-f98b741d2fcc\"><\u002Fscript>\n  <script src=\"55391368-6660-4363-a0c1-9f1494d9f0a1\"><\u002Fscript>\n  <script src=\"fa9a6b2e-fdf0-414d-b1ef-cf3e72674663\"><\u002Fscript>\n  <script src=\"c655c04e-4d06-4dee-8bc9-d7e2c5181599\"><\u002Fscript>\n  <script src=\"8c2b3aad-98a5-4b9f-9b44-da3153151cc0\"><\u002Fscript>\n  <script src=\"4bf6ca51-ea39-4d40-995c-65291c2bf453\"><\u002Fscript>\n  <script src=\"4ad17165-25de-437f-bc5b-ddf496d97afd\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
